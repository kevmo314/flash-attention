# Builds the FlashAttention wheels ninetyfive dispatches between, one library per
# GPU generation, and attaches them to the release:
#   FA2 (flash-attn)   -> SM80 (Ampere/Ada; SM80 SASS also runs on SM86/SM89)
#   FA3 (flash-attn-3) -> SM90 (Hopper)
#   FA4 (flash-attn-4) -> SM100+ (Blackwell); pure Python, JIT-compiled at runtime
# FA2/FA3 are built for x86_64 and aarch64 in parallel. FA3 uses the torch stable
# ABI, so its wheel is torch-version independent; FA2 is tied to TORCH_VERSION.

name: Build ninetyfive wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14t"
  TORCH_VERSION: "2.10.0"
  TORCH_INDEX: "https://download.pytorch.org/whl/cu130"
  CUDA_VERSION: "13.0.1"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  build-cuda:
    name: ${{ matrix.lib }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        lib: [fa2, fa3]
        # 22.04 for an older glibc baseline, as upstream's publish workflow does.
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout CUTLASS
        run: git submodule update --init --depth 1 csrc/cutlass

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android
          df -h /

      - name: Set up swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          linux-local-args: '["--toolkit"]'
          sub-packages: '["nvcc", "cudart", "cccl"]'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "torch==${TORCH_VERSION}" --index-url "${TORCH_INDEX}"
          python -m pip install setuptools ninja packaging wheel psutil
          python -c "import sys, torch; print(sys.version, torch.__version__, torch.version.cuda)"
          nvcc --version

      - name: Build wheel
        id: build
        run: |
          export FLASH_ATTENTION_FORCE_BUILD=TRUE
          # 4 vCPU / 16 GB runners: more parallel nvcc jobs run out of memory.
          export MAX_JOBS=2
          export NVCC_THREADS=1
          start=$(date +%s)
          if [ "${{ matrix.lib }}" = "fa2" ]; then
            export FLASH_ATTN_CUDA_ARCHS="80"
            python setup.py bdist_wheel --dist-dir=dist
            local_tag="cu130torch${TORCH_VERSION%.*}"
          else
            cd hopper
            export FLASH_ATTENTION_DISABLE_SM80=TRUE  # SM90 only
            python setup.py bdist_wheel --dist-dir=../dist
            cd ..
            local_tag="cu130"
          fi
          echo "build_minutes=$(( ($(date +%s) - start) / 60 ))" >> "$GITHUB_OUTPUT"
          for whl in dist/*.whl; do
            mv "$whl" "$(echo "$whl" | sed "s/-/+${local_tag}-/2")"
          done
          ls -la dist

      - name: Report build time
        run: echo "::notice title=${{ matrix.lib }} ${{ matrix.os }}::built in ${{ steps.build.outputs.build_minutes }} minutes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lib }}-${{ matrix.os }}
          path: dist/*.whl

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" dist/*.whl --clobber --repo "${GITHUB_REPOSITORY}"

  build-fa4:
    name: fa4 (pure Python)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          # flash-attn-4 versions itself from fa4-v* tags; pin it to this commit instead.
          export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_FLASH_ATTN_4="4.0.0+g$(git rev-parse --short HEAD)"
          python -m build --wheel --outdir dist flash_attn/cute
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fa4
          path: dist/*.whl

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" dist/*.whl --clobber --repo "${GITHUB_REPOSITORY}"
